<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PA CareerLink® Job Fair | April 1, 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; }
    .hero { 
      width: 100%; 
      max-width: 1000px; 
      margin: 0 auto; 
      padding: 20px 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
    }
    .hero img { 
      width: 100%; 
      height: auto; 
      max-height: 90vh; 
      object-fit: contain; /* Shows FULL image, no crop */
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
      border-radius: 15px; 
    }
    .cta { 
      text-align: center; 
      padding: 40px 20px; 
      background: linear-gradient(135deg, #003087, #0056b3); 
      color: white; 
    }
    .cta h2 { font-size: 2.5em; margin-bottom: 20px; }
    .btn { 
      display: inline-block; 
      background: #28a745; 
      color: white; 
      padding: 18px 40px; 
      text-decoration: none; 
      border-radius: 50px; 
      font-weight: bold; 
      font-size: 1.3em; 
      box-shadow: 0 10px 30px rgba(40,167,69,0.4); 
      transition: all 0.3s; 
    }
    .btn:hover { background: #218838; transform: translateY(-5px); }
    footer { 
      background: #333; 
      color: white; 
      text-align: center; 
      padding: 30px; 
      font-size: 1.1em; 
    }
    @media (max-width: 768px) { 
      .hero img { border-radius: 10px; padding: 10px; } 
      .cta h2 { font-size: 2em; }
    }
  </style>
</head>
<body>
  <!-- FULL FLYER HERO - No crop, perfect aspect ratio -->
  <div class="hero">
    <img src="Job Fair Flyer TV Board.png" alt="PA CareerLink Job Fair Flyer - All Details">
  </div>

  <!-- SIMPLE CTA -->
  <section class="cta">
    <h2>Have questions?</h2>
    <a href="jrazo@pa.gov?subject=April 1 Job Fair Questions&body=Name:%0DPhone:%0DVeteran?%0DInterests:" class="btn">Email Us</a>
    <p style="margin-top: 20px; opacity: 0.9;">No cost • Veterans prioritized • 85+ employers</p>
  </section>

  <footer>
    <p>PA CareerLink® Blair County | Wednesday, April 1, 2026 | Altoona, PA<br>
    <small>Scan QR code on flyer for instant mobile access</small></p>
  </footer>
</body>
</html>
